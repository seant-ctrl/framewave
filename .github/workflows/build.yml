name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
          - os: windows-latest
            target: --win
    permissions:
      contents: write
    env:
      # Unsigned builds (no Apple Developer / code-signing certificate in CI)
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer & main
        run: npm run build

      - name: Build macOS system-audio helper (ScreenCaptureKit)
        if: runner.os == 'macOS'
        run: bash native/mac/build.sh

      - name: Package (${{ matrix.target }})
        run: npx electron-builder ${{ matrix.target }} --config electron-builder.yml --publish never

      # Tag builds attach the packages straight to the GitHub Release (no artifact storage involved)
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
          generate_release_notes: true

      # Non-tag builds keep short-lived artifacts for testing; storage quota problems must not fail the build
      - name: Upload artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: framewave-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 3
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
