appId: com.framewave.app
productName: Framewave
npmRebuild: false
buildDependenciesFromSource: false
nodeGypRebuild: false
afterPack: scripts/afterPack.cjs
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - node_modules/ffmpeg-static/**
  - node_modules/uiohook-napi/**
  - node_modules/koffi/**
win:
  target:
    - nsis
    - portable
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: false
  gatekeeperAssess: false
  identity: null
  type: distribution
  extendInfo:
    NSCameraUsageDescription: Framewave uses your camera for the webcam overlay in recordings.
    NSMicrophoneUsageDescription: Framewave records your microphone during screen recordings.
    NSScreenCaptureUsageDescription: Framewave records your screen.
    NSAppleEventsUsageDescription: Framewave needs Accessibility access to track your cursor and clicks while recording.
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
